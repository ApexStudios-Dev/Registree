name: Test PR

on:
  pull_request:
    types:
      - synchronize
      - opened

jobs:
  generate-vars:
    name: Generate Vars
    uses: ApexStudios-Dev/.github/.github/workflows/_generate-vars.yml@master
    secrets: inherit

  build:
    name: Build
    needs: generate-vars
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_build.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}

  test:
    name: Test Production
    runs-on: ubuntu-latest
    needs: [ generate-vars, build ]
    if: success()
    steps:
      - name: Prepare Environment
        run: |
          mkdir mods
          wget -O "mods/registree-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/prs/registriee/pr${{ github.event.pull_request.number }}/dev/apexstudios/registree/${{ needs.generate-vars.outputs.version }}/registree-${{ needs.generate-vars.outputs.version }}.jar"

      - name: Test Production Server
        uses: ApexStudios-Dev/.github/actions/test-production-server@master
        with:
          java-version: 21
          java-vendor: temurin
          neoforge-version: 21.10.20-beta
          # neoforge-maven: 'https://prmaven.neoforged.net/NeoForge/pr2699'
